# dbt package manifest for `gudusoftware/gsp_dbt_lineage`.
# This package ships only declarative macros (config helpers + version metadata).
# Runtime — HTTP backend dispatch, cache, lineage emission — lives in the
# companion Python CLI `gsp-dbt-lineage` (installed via pip). See ADR-007.
name: 'gudusoftware_gsp_dbt_lineage'
version: '0.1.0'
config-version: 2

require-dbt-version: [">=1.5.0", "<2.0.0"]

# Where this package's macros live. The CLI does not import dbt; it reads
# `target/manifest.json` post-build, so these macros are config-surface only.
macro-paths: ["macros"]
