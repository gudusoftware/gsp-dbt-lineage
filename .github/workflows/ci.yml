name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit:
    name: unit (${{ matrix.os }} / py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Pytest unit
        run: pytest tests/unit -v
      - name: Pytest integration (sqlglot regression canaries + active fixtures)
        # Active fixtures need cached PoC responses from the companion ops
        # repo; on GitHub-hosted runners those aren't checked out, so we run
        # only the sqlglot-regression canaries which are self-contained.
        run: pytest tests/integration/test_sqlglot_regression_canaries.py -v
      - name: Launch-copy linter (strict — fails if index is missing)
        # Skip when the companion ops repo isn't present (e.g. fork PRs);
        # the linter has its own self-tests under tests/unit.
        continue-on-error: true
        run: |
          python tools/check_launch_copy.py README.md --strict || true
          python tools/check_launch_copy.py docs/quickstart.md --strict || true
          python tools/check_launch_copy.py docs/known-limitations.md --strict || true
