[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsp-dbt-lineage"
version = "0.0.1"
description = "Reliable column-level lineage for dbt projects, via Gudu SQLFlow. Fixes dbt CLL where sqlglot silently fails (BigQuery procedural SQL, dbt-utils deduplicate, MSSQL stored procedures)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Gudu Software", email = "info@gudusoft.com"},
]
keywords = ["dbt", "lineage", "column-level-lineage", "datahub", "openmetadata", "bigquery", "mssql", "sql-parser", "sqlflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
]
datahub = [
    "acryl-datahub>=0.12.0",
]
openmetadata = [
    "openmetadata-ingestion>=1.4.0",
]
jvm = [
    # Helper utilities for local-JAR mode (system Java still required externally)
]

[project.urls]
Homepage = "https://sqlparser.com/dbt-lineage/"
Repository = "https://github.com/gudusoftware/dbt-lineage"
Issues = "https://github.com/gudusoftware/dbt-lineage/issues"
Documentation = "https://sqlparser.com/dbt-lineage/"

[project.scripts]
gsp-dbt-lineage = "gsp_dbt_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
