[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsp-dbt-lineage"
version = "0.0.1"
description = "Reliable column-level lineage for dbt projects, via Gudu SQLFlow. Fixes dbt CLL where sqlglot silently fails (BigQuery procedural SQL, dbt-utils deduplicate, MSSQL stored procedures)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Gudu Software", email = "info@gudusoft.com"},
]
keywords = ["dbt", "lineage", "column-level-lineage", "datahub", "openmetadata", "bigquery", "mssql", "sql-parser", "sqlflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
    # Required by tests/integration/test_sqlglot_regression_canaries.py — these
    # are the Phase 4 §9.1 regression-fixture-corpus tests that must run in
    # CI per the runbook. Pin to the version the v1 plan was scoped against.
    "sqlglot>=30.6.0,<31.0",
]
datahub = [
    "acryl-datahub>=0.12.0",
]
openmetadata = [
    "openmetadata-ingestion>=1.4.0",
]
jvm = [
    # Reserved. There are no Python deps required for `--backend local_jar`:
    # the implementation uses `subprocess.run(["java", "-cp", <jar>, ...])`,
    # so the only system requirement is a JRE (Java 8+) on PATH. This extra
    # is kept declared for forward-compat — Phase 4 task 4.5 deferred a
    # decision on JPype-based bundling. Users do NOT need to install
    # `gsp-dbt-lineage[jvm]` today; install a JRE instead.
]

[project.urls]
Homepage = "https://sqlparser.com/dbt-lineage/"
Repository = "https://github.com/gudusoftware/gsp-dbt-lineage"
Issues = "https://github.com/gudusoftware/gsp-dbt-lineage/issues"
Documentation = "https://sqlparser.com/dbt-lineage/"

[project.scripts]
gsp-dbt-lineage = "gsp_dbt_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
