name: 'gudusoftware/dbt-lineage CI check'
description: 'Run gsp-dbt-lineage check on a dbt project to gate CI on column-lineage coverage and regressions.'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.11'
  manifest:
    description: 'Path to target/manifest.json'
    required: false
    default: 'target/manifest.json'
  backend:
    description: 'anonymous | authenticated | self_hosted | local_jar'
    required: false
    default: 'authenticated'
  user-id:
    description: 'GSP user id (forwarded to --user-id; usually $GSP_USER_ID)'
    required: false
  secret-key:
    description: 'GSP secret key (forwarded to --secret-key; usually $GSP_SECRET_KEY)'
    required: false
  url:
    description: 'Backend URL override (required for self_hosted)'
    required: false
  out:
    description: 'Output column_lineage.json path'
    required: false
    default: 'target/gudu/column_lineage.json'
  min-node-coverage:
    description: 'Minimum (parsed+partial)/eligible ratio (0..1)'
    required: false
    default: '0.95'
  min-column-coverage:
    description: 'Minimum resolved_columns/total_columns ratio (0..1)'
    required: false
    default: '0.0'
  fail-on-regression:
    description: 'true|false — when baseline given, fail on any node that lost lineage'
    required: false
    default: 'true'
  baseline:
    description: 'Optional path to a previous column_lineage.json for diff regression check'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install gsp-dbt-lineage
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install gsp-dbt-lineage

    - name: Run lineage extraction
      shell: bash
      # Route every input through the environment so they are not interpolated
      # into the bash source by GitHub's expression engine — that would allow
      # an input containing shell metacharacters to break command parsing.
      env:
        GSP_USER_ID: ${{ inputs.user-id }}
        GSP_SECRET_KEY: ${{ inputs.secret-key }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_BACKEND: ${{ inputs.backend }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_URL: ${{ inputs.url }}
      run: |
        set -eu
        ARGS=(--manifest "$INPUT_MANIFEST" --backend "$INPUT_BACKEND" --out "$INPUT_OUT")
        if [ -n "${INPUT_URL:-}" ]; then ARGS+=(--url "$INPUT_URL"); fi
        gsp-dbt-lineage run "${ARGS[@]}"

    - name: Check coverage and regressions
      shell: bash
      env:
        INPUT_OUT: ${{ inputs.out }}
        INPUT_MIN_NODE: ${{ inputs.min-node-coverage }}
        INPUT_MIN_COLUMN: ${{ inputs.min-column-coverage }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        set -eu
        ARGS=(--lineage "$INPUT_OUT")
        if [ "${INPUT_MIN_NODE:-0}" != "0" ]; then
          ARGS+=(--min-node-coverage "$INPUT_MIN_NODE")
        fi
        if [ "${INPUT_MIN_COLUMN:-0}" != "0" ]; then
          ARGS+=(--min-column-coverage "$INPUT_MIN_COLUMN")
        fi
        if [ -n "${INPUT_BASELINE:-}" ] && [ -f "$INPUT_BASELINE" ] && [ "${INPUT_FAIL_ON_REGRESSION:-false}" = "true" ]; then
          ARGS+=(--baseline "$INPUT_BASELINE" --fail-on-regression)
        fi
        gsp-dbt-lineage check "${ARGS[@]}"
